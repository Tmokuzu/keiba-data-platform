project:
  name: keiba-data-platform
  phase: phase2
  ticket_scope:
    - place

paths:
  raw_data_dir: data/raw
  temp_data_dir: temp
  processed_data_dir: data/processed
  model_dir: models
  log_dir: logs

# Backward-compatible aliases used by older ingestion helpers.
raw_data_dir: data/raw
temp_data_dir: temp

tables:
  raw_races: raw_races
  raw_entries: raw_entries
  raw_results: raw_results
  raw_payouts: raw_payouts
  raw_odds: raw_odds

modeling:
  target: target_place
  ticket_type: place
  random_state: 42
  test_size: 0.2
  valid_size: 0.2
  min_train_rows: 50
  output_dir: models
  predictions_path: data/processed/predictions_place.csv
  calibration:
    method: isotonic
    fit_split: valid
  race_probability_correction:
    min_probability: 0.01
    max_probability: 0.95
    place_slots:
      field_size_8_or_more: 3
      field_size_5_to_7: 2

data:
  # 発走何分前までの複勝オッズを、事前オッズとして有効とみなすか。
  odds_snapshot_cutoff_minutes_before_start: 1

ensemble:
  method: simple_average
  weights:
    lgbm: 0.34
    catboost: 0.33
    xgboost: 0.33

safe_agent:
  min_expected_value_place: 1.05
  min_value_gap: 0.03
  min_bet_score: 0.02
  max_model_uncertainty: 0.10
  stake_high: 1000
  stake_mid: 500
  stake_low: 300

validation:
  threshold_optimization:
    min_validation_bets: 50
  walk_forward:
    folds:
      - train_start: 2016
        train_end: 2019
        valid_start: 2020
        valid_end: 2020
        test_start: 2021
        test_end: 2021
      - train_start: 2016
        train_end: 2020
        valid_start: 2021
        valid_end: 2021
        test_start: 2022
        test_end: 2022
      - train_start: 2016
        train_end: 2021
        valid_start: 2022
        valid_end: 2022
        test_start: 2023
        test_end: 2023
      - train_start: 2016
        train_end: 2022
        valid_start: 2023
        valid_end: 2023
        test_start: 2024
        test_end: 2024
      - train_start: 2016
        train_end: 2023
        valid_start: 2024
        valid_end: 2024
        test_start: 2025
        test_end: 2025
  ablation_sets:
    - all_features
    - no_jockey_trainer_id
    - no_odds
    - no_market_features
    - no_recent_form
    - no_suitability
    - no_race_grade_ground_condition

artifacts:
  phase1:
    diagnostics: data/processed/phase1_diagnostics.json
    acceptance_report: data/processed/acceptance_report.json
  phase2:
    predictions: data/processed/predictions_place.csv
    model_compare_summary: data/processed/model_compare_summary.csv
    walk_forward_summary: data/processed/walk_forward_summary.csv
    walk_forward_detail: data/processed/walk_forward_detail.csv
    ablation_summary: data/processed/ablation_summary.csv
    report: data/processed/phase2_report.json
    segmented_backtest_report: data/processed/segmented_backtest_report.csv
    threshold_optimization_report: data/processed/threshold_optimization_report.json
